
<section class="services" id="services">
  <div class="services__inner">
    <p class="services__eyebrow">
      <span></span>
      SERVICES
    </p>

    <div class="services__heading">
      <h2>
        ოთხი სერვისი.<br />
        ერთი სტანდარტი.
      </h2>

      <a class="services__all" routerLink="/services">
        ყველა სერვისი <span>→</span>
      </a>
    </div>

    <div class="services__grid">
      @for (service of services; track service.number) {
        <article class="service-card">
          <a
            class="service-card__image-link"
            [routerLink]="service.link"
            [attr.aria-label]="service.title"
          >
            <img
              class="service-card__image"
              [src]="service.image"
              [alt]="service.title"
              loading="lazy"
            />
          </a>

          <span class="service-card__number">
            {{ service.number }}
          </span>

          <h3>{{ service.title }}</h3>

          <p class="service-card__description">
            {{ service.description }}
          </p>

          <a class="service-card__link" [routerLink]="service.link">
            დეტალურად <span>→</span>
          </a>
        </article>
      }
    </div>
  </div>
</section>
